name: Optimize images

on:
  push:
    branches: [master]
    paths:
      - "gallery/**"
      - "images/**"

permissions:
  contents: write

jobs:
  optimize:
    # the commit this workflow makes triggers another push - without this
    # guard it would try to compress its own already-compressed output forever
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so the before-SHA below is always available locally

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Find changed images
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # Diff against the push's actual before/after commits, not HEAD~1 - for a
          # merge commit, HEAD~1 (first parent only) makes every file the other side
          # of the merge touched look "changed", even if it was already compressed.
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            BASE=$(git hash-object -t tree /dev/null) # new branch: treat everything as new
          else
            BASE="$BEFORE"
          fi
          git diff --name-only "$BASE" "$AFTER" -- gallery images \
            | grep -Ei '\.(jpe?g|png|webp)$' > "$RUNNER_TEMP/changed_images.txt" || true
          echo "count=$(wc -l < "$RUNNER_TEMP/changed_images.txt")" >> "$GITHUB_OUTPUT"

      - name: Install sharp
        if: steps.changed.outputs.count != '0'
        working-directory: .github/scripts
        run: npm install

      - name: Compress changed images
        if: steps.changed.outputs.count != '0'
        run: node .github/scripts/optimize-images.mjs "$RUNNER_TEMP/changed_images.txt"

      - name: Commit compressed images
        if: steps.changed.outputs.count != '0'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-compress newly added images"
          file_pattern: "gallery/** images/**"
