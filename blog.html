---
layout: default
title: The Sarah Era
stylesheet: /blog.css
---
<div id="sort-controls">
  <button class="sort-option active" onclick="changeSort('newest')">Newest</button>
  <button class="sort-option" onclick="changeSort('oldest')">Oldest</button>
</div>

<section class="blog-section">
  <!-- Container for dynamically loaded blog posts -->
  <div id="blog-container"></div>

  <!-- Pagination controls -->
  <div id="pagination"></div>
</section>

<script>
  // Generated from _posts/ at build time - add/edit posts as files in _posts/, not here.
  const blogPosts = [
    {% for post in site.posts %}
    {
      title: {{ post.title | jsonify }},
      content: {{ post.teaser | default: "" | jsonify }},
      link: {{ post.url | jsonify }},
      image: {{ post.image | default: "" | jsonify }},
      date: {{ post.date | date: "%B %-d, %Y" | jsonify }},
      topic: {{ post.topic | default: "SELF-DEVELOPMENT" | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];
</script>
<script src="/blog.js"></script>
